<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>座席シャッフル抽選</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=DM+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --border: #d7dde5;
        --accent: #d97706;
        --teal: #0f766e;
        --red: #dc2626;
        --purple: #a14c78;
        --orange: #ea580c;
        --text: #243142;
        --muted: #64748b;
        --radius: 16px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        font-size: 17px;
      }
      body {
        font-family: 'Zen Kaku Gothic New', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 56px 20px 80px;
        overflow-x: hidden;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(100, 116, 139, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(100, 116, 139, 0.08) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
        z-index: 0;
      }

      main {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1000px;
        display: flex;
        flex-direction: column;
        gap: 26px;
      }

      header {
        text-align: center;
      }
      .label {
        display: inline-block;
        font-family: 'DM Mono', monospace;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        color: var(--accent);
        border: 1px solid var(--accent);
        padding: 5px 14px;
        border-radius: 100px;
        margin-bottom: 16px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 2.1rem;
        font-weight: 900;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }
      h1 span {
        color: var(--accent);
      }
      .sub {
        margin-top: 10px;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.6;
      }

      section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px 26px;
      }
      section h2 {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      section .desc {
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 18px;
        line-height: 1.6;
      }

      /* ===== 生徒設定 ===== */
      #student-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .student-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .student-row .idx {
        font-family: 'DM Mono', monospace;
        font-size: 0.75rem;
        color: var(--muted);
        width: 22px;
        text-align: right;
        flex-shrink: 0;
      }
      .student-row input[type='text'] {
        flex: 1 1 120px;
        min-width: 90px;
        background: transparent;
        border: none;
        color: var(--text);
        font-family: 'Zen Kaku Gothic New', sans-serif;
        font-size: 0.95rem;
        padding: 6px 4px;
        border-bottom: 1px solid transparent;
      }
      .student-row input[type='text']:focus {
        outline: none;
        border-bottom: 1px solid var(--accent);
      }
      .pref-chip {
        font-family: 'DM Mono', monospace;
        font-size: 0.72rem;
        letter-spacing: 0.02em;
        padding: 6px 12px;
        border-radius: 100px;
        cursor: pointer;
        user-select: none;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        transition: all 0.15s;
        white-space: nowrap;
      }
      .pref-chip.on.screen {
        background: rgba(15, 118, 110, 0.12);
        color: var(--teal);
        border-color: rgba(15, 118, 110, 0.38);
      }
      .pref-chip.on.sub {
        background: rgba(161, 76, 120, 0.12);
        color: var(--purple);
        border-color: rgba(161, 76, 120, 0.38);
      }
      .pref-chip.on.aircon {
        background: rgba(234, 88, 12, 0.12);
        color: var(--orange);
        border-color: rgba(234, 88, 12, 0.38);
      }
      .del-btn {
        margin-left: auto;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 1rem;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 8px;
        flex-shrink: 0;
      }
      .del-btn:hover {
        color: var(--red);
        background: rgba(255, 107, 107, 0.1);
      }

      .list-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .ghost-btn {
        font-family: 'Zen Kaku Gothic New', sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        padding: 10px 18px;
        border-radius: 100px;
        cursor: pointer;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        transition: all 0.15s;
      }
      .ghost-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }
      .ghost-btn.warn:hover {
        color: var(--red);
        border-color: rgba(255, 107, 107, 0.4);
      }
      .count-note {
        font-size: 0.8rem;
        color: var(--muted);
        font-family: 'DM Mono', monospace;
        margin-top: 10px;
      }
      .count-note.over {
        color: var(--red);
      }

      /* ===== 凡例 ===== */
      .legend {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        flex-shrink: 0;
      }

      /* ===== 座席表 ===== */
      .map-scroll {
        overflow-x: auto;
        padding-bottom: 6px;
      }
      .scroll-hint {
        font-size: 0.75rem;
        color: var(--muted);
        text-align: right;
        display: none;
        margin-bottom: 6px;
      }
      #seat-map {
        display: grid;
        grid-template-columns: 84px 84px 84px 84px 34px 84px 84px 84px;
        grid-auto-rows: min-content;
        gap: 8px 10px;
        min-width: 700px;
        padding: 4px;
      }
      .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        border-radius: 10px;
      }
      .cell-label {
        font-family: 'DM Mono', monospace;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        background: var(--bg);
        border: 1px dashed var(--border);
        padding: 10px 6px;
        white-space: nowrap;
      }
      .cell-teacher {
        font-weight: 700;
        font-size: 0.88rem;
        color: var(--accent);
        background: rgba(245, 200, 66, 0.1);
        border: 1px solid rgba(245, 200, 66, 0.35);
        padding: 16px 6px;
      }
      .zone-caption {
        font-family: 'DM Mono', monospace;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        padding: 6px 4px;
        border-radius: 8px;
        white-space: nowrap;
      }
      .zone-caption.front {
        color: var(--teal);
        background: rgba(15, 118, 110, 0.08);
      }
      .zone-caption.back {
        color: var(--purple);
        background: rgba(161, 76, 120, 0.08);
      }

      .seat {
        position: relative;
        flex-direction: column;
        gap: 2px;
        background: var(--bg);
        border: 1px solid var(--border);
        padding: 10px 4px;
        min-height: 64px;
        font-size: 0.86rem;
        font-weight: 700;
        transition:
          background 0.2s,
          border-color 0.2s,
          transform 0.2s;
      }
      .seat.zone-front-seat {
        border-top: 3px solid rgba(15, 118, 110, 0.45);
      }
      .seat.zone-back-seat {
        border-top: 3px solid rgba(161, 76, 120, 0.45);
      }
      .seat.aircon-avoided {
        color: #94a3b8;
        background: #eef2f6;
        border: 1px dashed #b8c2cf;
        font-size: 0.74rem;
        font-weight: 400;
      }
      .seat.empty {
        color: var(--muted);
        font-weight: 400;
        font-size: 0.78rem;
      }
      .seat.filled.rolling {
        color: var(--muted);
        font-family: 'DM Mono', monospace;
        font-size: 0.72rem;
      }
      .seat.filled.settled {
        animation: seat-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      @keyframes seat-pop {
        0% {
          transform: scale(0.85);
          opacity: 0.4;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .seat .badge {
        position: absolute;
        top: -8px;
        right: -6px;
        font-size: 0.85rem;
        background: var(--surface);
        border-radius: 50%;
        padding: 1px;
      }
      .seat .badge.unmet {
        filter: grayscale(1) opacity(0.6);
      }

      /* ===== 実行ボタン ===== */
      .btn-row {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button.primary {
        font-family: 'Zen Kaku Gothic New', sans-serif;
        font-weight: 700;
        border: none;
        border-radius: 100px;
        cursor: pointer;
        flex: 0 1 320px;
        padding: 20px 30px;
        font-size: 1.1rem;
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 4px 22px rgba(217, 119, 6, 0.24);
        transition:
          transform 0.15s,
          box-shadow 0.15s,
          opacity 0.2s;
      }
      button.primary:hover:not(:disabled) {
        box-shadow: 0 6px 30px rgba(217, 119, 6, 0.36);
        transform: translateY(-1px);
      }
      button.primary:active:not(:disabled) {
        transform: scale(0.97);
      }
      button.primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.secondary {
        font-family: 'Zen Kaku Gothic New', sans-serif;
        font-weight: 700;
        padding: 20px 26px;
        font-size: 0.95rem;
        border-radius: 100px;
        cursor: pointer;
        background: var(--surface);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      button.secondary:hover {
        background: var(--border);
        color: var(--text);
      }

      #warning-box {
        display: none;
        background: rgba(220, 38, 38, 0.08);
        border: 1px solid rgba(220, 38, 38, 0.3);
        border-radius: 12px;
        padding: 14px 18px;
        font-size: 0.85rem;
        color: #ffb4b4;
        line-height: 1.7;
      }
      #warning-box.visible {
        display: block;
      }
      #warning-box b {
        color: var(--red);
      }

      .particle {
        position: fixed;
        pointer-events: none;
        border-radius: 50%;
        z-index: 999;
        animation: fly 1.1s ease-out forwards;
      }
      @keyframes fly {
        0% {
          transform: translate(0, 0) scale(1);
          opacity: 1;
        }
        100% {
          transform: translate(var(--tx), var(--ty)) scale(0);
          opacity: 0;
        }
      }

      @media (max-width: 700px) {
        html {
          font-size: 15px;
        }
        body {
          padding: 40px 14px 70px;
        }
        h1 {
          font-size: 1.7rem;
        }
        section {
          padding: 18px 16px;
        }
        .scroll-hint {
          display: block;
        }
        button.primary,
        button.secondary {
          flex-basis: 100%;
        }
      }

      @media print {
        body::before,
        #student-settings,
        .btn-row,
        #warning-box,
        .legend {
          display: none !important;
        }
        body {
          padding: 10px;
          background: #fff;
          color: #000;
        }
        section {
          background: #fff;
          border-color: #999;
        }
        .seat {
          border-color: #999;
          background: #fff;
          color: #000;
        }
        .cell-label,
        .cell-teacher,
        .zone-caption {
          color: #333;
          background: #fff;
          border-color: #999;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="label">Seat Lottery</div>
        <h1>教室の<span>席替え抽選</span></h1>
        <p class="sub">
          スクリーン希望・サブ講師希望の生徒を優先ゾーンに配置しつつ、残りはランダムに席替えします。
        </p>
      </header>

      <section id="student-settings">
        <h2>生徒と希望の設定</h2>
        <p class="desc">
          名前は自由に編集・追加・削除できます。「スクリーン希望」は前2列、「サブ講師希望」はサブ講師席に近い最後列を優先して割り当てます。両方チェックした生徒はどちらか一方の空きに優先配置されます。
        </p>
        <div id="student-list"></div>
        <div class="list-actions">
          <button type="button" class="ghost-btn" onclick="addStudent()">
            ＋ 生徒を追加
          </button>
          <button
            type="button"
            class="ghost-btn warn"
            onclick="resetToDefault()"
          >
            デフォルト名簿(25名)に戻す
          </button>
        </div>
        <p class="count-note" id="count-note"></p>
      </section>

      <section>
        <h2>座席表</h2>
        <div class="legend">
          <div class="legend-item">
            <span
              class="legend-dot"
              style="background: rgba(15, 118, 110, 0.45)"
            ></span
            >スクリーン優先ゾーン(前2列)
          </div>
          <div class="legend-item">
            <span
              class="legend-dot"
              style="background: rgba(161, 76, 120, 0.45)"
            ></span
            >サブ講師優先ゾーン(最後列)
          </div>
          <div class="legend-item">スクリーン希望を実現</div>
          <div class="legend-item">サブ講師希望を実現</div>
        </div>
        <p class="scroll-hint">→ 横にスクロールできます</p>
        <div class="map-scroll">
          <div id="seat-map"></div>
        </div>
      </section>

      <div id="warning-box"></div>

      <div class="btn-row">
        <button
          type="button"
          class="primary"
          id="shuffle-btn"
          onclick="runShuffle()"
        >
          席をシャッフルする
        </button>
        <button type="button" class="secondary" onclick="window.print()">
          印刷する
        </button>
      </div>
    </main>

    <script>
      // =============================================
      //  教室レイアウト（アップロードされた座席表①②に基づく）
      //  出入口(前) → 講師席(前) → 座席4列(各列: 左4席+右2〜3席) → サブ講師席(後)
      // =============================================
      const DEFAULT_NAMES = [
        '池田 華子',
        '石川 明日香',
        '泉野 円果',
        '井本 千恵',
        '榎本 百香',
        '小笠原 清光',
        '笠原 文',
        '加藤 天音',
        '木村 優花',
        '久保 友紀',
        '榮 由貴',
        '高橋 佑季',
        '千葉 里央奈',
        '寺田 光貴',
        '中嶋 梨帆',
        '中山 ちあき',
        '能見 明日香',
        '辺見 加奈子',
        '前窪 鉄平',
        '松永 悠司',
        '松原 祐太',
        '森實 千尋',
        '森本 菜々',
        '保田 夕佳',
        '山岡 正美',
      ];

      // col: 1-4 = 左ブロック, 5 = 通路, 6-8 = 右ブロック（1列目のみ8まで使用）
      const SEATS = [];
      [1, 2, 3, 4].forEach((row) => {
        [1, 2, 3, 4].forEach((col) =>
          SEATS.push({ id: `r${row}c${col}`, row, col }),
        );
        const rightCols = row === 1 ? [6, 7, 8] : [6, 7];
        rightCols.forEach((col) =>
          SEATS.push({ id: `r${row}c${col}`, row, col }),
        );
      });

      function isFrontZone(seat) {
        return seat.row <= 2;
      }
      function isBackZone(seat) {
        return seat.row === 4;
      }
      // grid行: 1=出入口 2=講師 3=前ゾーン見出し 4-5=座席1-2列目 6=後ゾーン見出し 7=座席3列目 8=後ゾーン見出し 9=座席4列目 10=サブ講師
      const SEAT_GRID_ROW = { 1: 4, 2: 5, 3: 7, 4: 9 };
      function gridRowOf(seatRow) {
        return SEAT_GRID_ROW[seatRow];
      }
      const AIRCON_SEAT_IDS = new Set([
        'r1c1',
        'r1c2',
        'r1c3',
        'r3c6',
        'r3c7',
        'r4c6',
        'r4c7',
      ]);
      function isAirconSeat(seat) {
        return AIRCON_SEAT_IDS.has(seat.id);
      }

      // =============================================
      //  生徒データ（localStorageに保存）
      // =============================================
      const STORAGE_KEY = 'seatLottery.students.v1';
      let students = [];
      let uidSeq = 1;
      const newId = () => 'st' + uidSeq++;

      function loadStudents() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length) {
              students = parsed.map((s) => ({
                id: newId(),
                name: s.name || '',
                screenPref: !!s.screenPref,
                subPref: !!s.subPref,
                avoidAircon: !!s.avoidAircon,
              }));
              return;
            }
          }
        } catch (e) {
          /* 無視してデフォルトへ */
        }
        students = DEFAULT_NAMES.map((name) => ({
          id: newId(),
          name,
          screenPref: false,
          subPref: false,
          avoidAircon: false,
        }));
      }

      function saveStudents() {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
              students.map(({ name, screenPref, subPref, avoidAircon }) => ({
                name,
                screenPref,
                subPref,
                avoidAircon,
              })),
            ),
          );
        } catch (e) {
          /* 保存できなくても続行 */
        }
      }

      function resetToDefault() {
        if (
          !confirm(
            'デフォルトの25名の名簿にリセットします。現在の編集内容は失われます。よろしいですか？',
          )
        )
          return;
        students = DEFAULT_NAMES.map((name) => ({
          id: newId(),
          name,
          screenPref: false,
          subPref: false,
          avoidAircon: false,
        }));
        saveStudents();
        renderStudentList();
        renderSeatMap(null);
      }

      function addStudent() {
        students.push({
          id: newId(),
          name: '',
          screenPref: false,
          subPref: false,
          avoidAircon: false,
        });
        saveStudents();
        renderStudentList();
      }

      function removeStudent(id) {
        students = students.filter((s) => s.id !== id);
        saveStudents();
        renderStudentList();
      }

      function renderStudentList() {
        const list = document.getElementById('student-list');
        list.innerHTML = students
          .map(
            (s, i) => `
    <div class="student-row" data-id="${s.id}">
      <span class="idx">${i + 1}</span>
      <input type="text" value="${escapeHtml(s.name)}" placeholder="生徒名" data-role="name">
      <span class="pref-chip screen ${s.screenPref ? 'on' : ''}" data-role="screen">スクリーン希望</span>
      <span class="pref-chip sub ${s.subPref ? 'on' : ''}" data-role="sub">サブ講師希望</span>
      <span class="pref-chip aircon ${s.avoidAircon ? 'on' : ''}" data-role="aircon">空調側を避ける</span>
      <button type="button" class="del-btn" data-role="del">✕</button>
    </div>
  `,
          )
          .join('');
        updateCountNote();
      }

      function escapeHtml(str) {
        return String(str).replace(
          /[&<>"']/g,
          (c) =>
            ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;',
            })[c],
        );
      }

      function seatDisplayName(name) {
        return String(name).trim().split(/\s+/)[0] || '(無名)';
      }

      document.getElementById('student-list').addEventListener('input', (e) => {
        const row = e.target.closest('.student-row');
        if (!row) return;
        const s = students.find((s) => s.id === row.dataset.id);
        if (!s) return;
        if (e.target.dataset.role === 'name') {
          s.name = e.target.value;
          saveStudents();
        }
      });

      document.getElementById('student-list').addEventListener('click', (e) => {
        const row = e.target.closest('.student-row');
        if (!row) return;
        const s = students.find((s) => s.id === row.dataset.id);
        if (!s) return;
        const role = e.target.dataset.role;
        if (role === 'screen') {
          s.screenPref = !s.screenPref;
          saveStudents();
          renderStudentList();
        } else if (role === 'sub') {
          s.subPref = !s.subPref;
          saveStudents();
          renderStudentList();
        } else if (role === 'aircon') {
          s.avoidAircon = !s.avoidAircon;
          saveStudents();
          renderStudentList();
        } else if (role === 'del') {
          removeStudent(s.id);
        }
      });

      function updateCountNote() {
        const note = document.getElementById('count-note');
        const n = students.filter((s) => s.name.trim()).length;
        note.textContent = `登録人数: ${n} / 座席数: ${SEATS.length}`;
        note.classList.toggle('over', n > SEATS.length);
      }

      // =============================================
      //  座席表の描画
      // =============================================
      function renderSeatMap(assignment) {
        const map = document.getElementById('seat-map');
        const html = [];

        html.push(
          `<div class="cell cell-label" style="grid-row:1;grid-column:2/4;">出入口</div>`,
        );
        html.push(
          `<div class="cell cell-teacher" style="grid-row:2;grid-column:5/7;">講師席</div>`,
        );
        html.push(
          `<div class="cell zone-caption front" style="grid-row:3;grid-column:1/9;justify-self:start;">👀 スクリーン優先ゾーン（1〜2列目）</div>`,
        );
        html.push(
          `<div class="cell zone-caption back" style="grid-row:8;grid-column:1/9;justify-self:start;">サブ講師優先ゾーン（最後列）</div>`,
        );

        SEATS.forEach((seat) => {
          const student = assignment ? assignment.get(seat.id) : null;
          const zoneClass = isFrontZone(seat)
            ? 'zone-front-seat'
            : isBackZone(seat)
              ? 'zone-back-seat'
              : '';
          let badge = '';
          if (student) {
            if (student.screenPref && isFrontZone(seat))
              badge += `<span class="badge" title="スクリーン希望を実現">希望</span>`;
            if (student.subPref && isBackZone(seat))
              badge += `<span class="badge" title="サブ講師希望を実現">希望</span>`;
          }
          const content = student
            ? `<span class="seat-name">${escapeHtml(seatDisplayName(student.name))}</span>${badge}`
            : `<span class="seat-name">空席</span>`;
          html.push(
            `<div class="cell seat ${zoneClass} ${student ? 'filled settled' : 'empty'}" style="grid-row:${gridRowOf(seat.row)};grid-column:${seat.col};">${content}</div>`,
          );
        });

        html.push(
          `<div class="cell cell-label" style="grid-row:${gridRowOf(4) + 1};grid-column:2/4;">サブ講師席</div>`,
        );

        map.innerHTML = html.join('');
      }

      // =============================================
      //  抽選ロジック
      // =============================================
      function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function assignSeats(activeStudents) {
        const both = shuffleArray(
          activeStudents.filter((s) => s.screenPref && s.subPref),
        );
        const screenOnly = shuffleArray(
          activeStudents.filter((s) => s.screenPref && !s.subPref),
        );
        const subOnly = shuffleArray(
          activeStudents.filter((s) => !s.screenPref && s.subPref),
        );

        let frontSeats = shuffleArray(SEATS.filter(isFrontZone));
        let backSeats = shuffleArray(SEATS.filter(isBackZone));

        const assignment = new Map();
        const usedSeatIds = new Set();
        const usedStudentIds = new Set();

        function takeFrom(seatList, student, allowAircon = false) {
          const index = seatList.findIndex(
            (seat) =>
              allowAircon || !student.avoidAircon || !isAirconSeat(seat),
          );
          return index === -1 ? null : seatList.splice(index, 1)[0];
        }
        function takePreferredFrom(seatList, student) {
          return (
            takeFrom(seatList, student) || takeFrom(seatList, student, true)
          );
        }
        function place(seat, student) {
          if (!seat) return false;
          assignment.set(seat.id, student);
          usedSeatIds.add(seat.id);
          usedStudentIds.add(student.id);
          return true;
        }

        both.forEach((st) => {
          const frontFirst = Math.random() < 0.5;
          const seat = frontFirst
            ? takePreferredFrom(frontSeats, st) ||
              takePreferredFrom(backSeats, st)
            : takePreferredFrom(backSeats, st) ||
              takePreferredFrom(frontSeats, st);
          place(seat, st);
        });
        screenOnly.forEach((st) =>
          place(takePreferredFrom(frontSeats, st), st),
        );
        subOnly.forEach((st) => place(takePreferredFrom(backSeats, st), st));

        const remainingStudents = shuffleArray(
          activeStudents.filter((s) => !usedStudentIds.has(s.id)),
        );
        const remainingSeats = shuffleArray(
          SEATS.filter((s) => !usedSeatIds.has(s.id)),
        );
        remainingStudents.forEach((st) => {
          const seat = takePreferredFrom(remainingSeats, st);
          if (seat) place(seat, st);
        });

        return assignment;
      }

      function collectUnmet(activeStudents, assignment) {
        const seatById = new Map(SEATS.map((s) => [s.id, s]));
        const seatOf = new Map();
        assignment.forEach((student, seatId) =>
          seatOf.set(student.id, seatById.get(seatId)),
        );

        const unmet = [];
        activeStudents.forEach((st) => {
          const seat = seatOf.get(st.id);
          if (st.screenPref && (!seat || !isFrontZone(seat)))
            unmet.push(`${st.name || '(無名)'}さん（スクリーン希望）`);
          if (st.subPref && (!seat || !isBackZone(seat)))
            unmet.push(`${st.name || '(無名)'}さん（サブ講師希望）`);
        });
        return unmet;
      }

      let rollTimer = null;
      let audioContext = null;

      function playTone(frequency, startTime, duration, volume) {
        try {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'triangle';
          oscillator.frequency.setValueAtTime(frequency, startTime);
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(startTime);
          oscillator.stop(startTime + duration + 0.01);
        } catch (e) {
          // 音声が使えなくても抽選は続ける。
        }
      }

      function startSound() {
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          if (!audioContext) audioContext = new AudioContextClass();
          if (audioContext.state === 'suspended') {
            Promise.resolve(audioContext.resume()).catch(() => {});
          }
          // クリック操作中に音声を開始して、ブラウザの再生制限を解除する。
          playTone(660, audioContext.currentTime, 0.08, 0.08);
        } catch (e) {
          audioContext = null;
        }
      }

      function playResultSound() {
        if (!audioContext || audioContext.state !== 'running') return;
        const now = audioContext.currentTime;
        [523.25, 659.25, 783.99].forEach((frequency, index) => {
          playTone(frequency, now + index * 0.12, 0.35, 0.12);
        });
      }

      function runShuffle() {
        const btn = document.getElementById('shuffle-btn');
        const warningBox = document.getElementById('warning-box');
        const activeStudents = students.filter((s) => s.name.trim());

        if (activeStudents.length === 0) {
          alert('生徒を1人以上登録してください。');
          return;
        }
        if (activeStudents.length > SEATS.length) {
          alert(
            `座席数(${SEATS.length}席)を超えています。人数を${activeStudents.length - SEATS.length}人減らしてください。`,
          );
          return;
        }

        btn.disabled = true;
        btn.textContent = '抽選中...';
        warningBox.classList.remove('visible');
        renderSeatMap(null);

        const namesPool = activeStudents.map((s) => s.name || '(無名)');
        let ticks = 0;
        rollTimer = setInterval(() => {
          document
            .querySelectorAll('#seat-map .seat:not(.aircon-avoided)')
            .forEach((el) => {
              el.classList.add('filled', 'rolling');
              el.classList.remove('settled', 'empty');
              const nameEl = el.querySelector('.seat-name');
              if (nameEl)
                nameEl.textContent =
                  namesPool[Math.floor(Math.random() * namesPool.length)];
            });
          ticks++;
          if (ticks % 8 === 0 && audioContext?.state === 'running') {
            playTone(440 + (ticks % 3) * 70, audioContext.currentTime, 0.08, 0.05);
          }
        }, 60);
        setTimeout(() => {
          clearInterval(rollTimer);
          rollTimer = null;
          finalizeShuffle(activeStudents);
        }, 10000);
        startSound();
      }

      function finalizeShuffle(activeStudents) {
        const btn = document.getElementById('shuffle-btn');
        const warningBox = document.getElementById('warning-box');
        const assignment = assignSeats(activeStudents);
        renderSeatMap(assignment);
        spawnParticles(document.getElementById('seat-map'));
        playResultSound();

        const unmet = collectUnmet(activeStudents, assignment);
        if (unmet.length) {
          warningBox.innerHTML = `<b>希望に沿えなかった生徒がいます（座席数の都合）：</b><br>${unmet.join('、 ')}`;
          warningBox.classList.add('visible');
        }

        btn.disabled = false;
        btn.textContent = 'もう一度シャッフルする';
      }

      function spawnParticles(el) {
        const cols = ['#f5c842', '#4ecdc4', '#a78bfa', '#ff6b6b', '#fb923c'];
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2,
          cy = rect.top + Math.min(rect.height, 300) / 2;
        for (let i = 0; i < 24; i++) {
          const p = document.createElement('div');
          p.className = 'particle';
          const sz = 5 + Math.random() * 8,
            ang = Math.random() * Math.PI * 2,
            d = 80 + Math.random() * 200;
          p.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;
      background:${cols[Math.floor(Math.random() * cols.length)]};
      --tx:${Math.cos(ang) * d}px;--ty:${Math.sin(ang) * d}px;
      animation-duration:${0.7 + Math.random() * 0.5}s;`;
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1300);
        }
      }

      // =============================================
      //  初期化
      // =============================================
      loadStudents();
      renderStudentList();
      renderSeatMap(null);
      updateAirconButton();
    </script>
  </body>
</html>
